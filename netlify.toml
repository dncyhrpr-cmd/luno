[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Firebase Admin SDK (Server-side) - Set these in Netlify environment variables
# FIREBASE_PROJECT_ID
# FIREBASE_PRIVATE_KEY
# FIREBASE_CLIENT_EMAIL

# API Base URL - Leave unset for relative paths in production
# NEXT_PUBLIC_API_URL

# Client-side Firebase (already set in environment)
# NEXT_PUBLIC_FIREBASE_API_KEY
# NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
# NEXT_PUBLIC_FIREBASE_PROJECT_ID
# NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
# NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
# NEXT_PUBLIC_FIREBASE_APP_ID
# NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID

[functions.resolve-binary-trades]
  directory = "netlify/functions/resolve-binary-trades"
  schedule = "@every 30s"

[functions.delete-old-resolved-trades]
  directory = "netlify/functions/delete-old-resolved-trades"
  schedule = "@every 30s"

[[plugins]]
  package = "@netlify/plugin-nextjs"